services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://makalipie.com}
        NEXT_PUBLIC_GRABFOOD_URL: ${NEXT_PUBLIC_GRABFOOD_URL:-}
    ports:
      - "3006:3000"
    env_file:
      - .env
    restart: unless-stopped
